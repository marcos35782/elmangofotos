<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Elegí tu plan · propuesta</title>
<style>
:root{--marca:#1E5B45;--acento:#F5A524;--t:"Poppins",sans-serif;--x:"Inter",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#e9e9e4;font-family:var(--x)}
#todo{display:flex;gap:28px;padding:36px;align-items:flex-start}
.col{width:390px}
.rot{font-family:var(--t);font-weight:600;font-size:15px;color:#555;margin:0 0 10px 6px}
.pan{border-radius:28px;overflow:hidden;padding:20px 18px 26px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.claro{--bg:#F5F5F0;--card:#fff;--tinta:#1B1B18;--gris:#5E5E58;--linea:#E3E3DC;--fam:#1E5B45;--famtx:#fff;--ic:#EEF3EF;--sel:#fff;--tog:#E9E9E3}
.oscuro{--bg:#111312;--card:#1C1F1D;--tinta:#F2F2EE;--gris:#B4B8B2;--linea:#2E332F;--fam:#174A38;--famtx:#fff;--ic:#26302A;--sel:#2E3530;--tog:#1C1F1D}
.pan{background:var(--bg);color:var(--tinta)}
h1{font-family:var(--t);font-size:23px;margin:0}
.sub{font-size:14px;color:var(--gris);margin:6px 0 16px}
.tog{display:flex;background:var(--tog);border-radius:16px;padding:4px;gap:4px}
.tog div{flex:1;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--t);font-weight:600;font-size:14px;color:var(--gris)}
.tog .on{background:var(--sel);color:var(--tinta);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chip{background:var(--acento);color:#3a2600;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700}
.card{background:var(--card);border:1.5px solid var(--linea);border-radius:22px;padding:18px;margin-top:14px}
.card.prem{border:2px solid var(--acento)}
.card.fam{background:var(--fam);border:none;color:var(--famtx)}
.card.mio{border:2.5px solid var(--marca)}
.oscuro .card.mio{border-color:#5FBF8F}
.top{display:flex;align-items:center;gap:10px}
.ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px}
.prem .ico{background:var(--acento)} .fam .ico{background:rgba(255,255,255,.14)}
.nom{font-family:var(--t);font-weight:700;font-size:19px}
.badge{margin-left:auto;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.b-rec{background:#FFF1D6;color:#7A4A00}
.oscuro .b-rec{background:#3A2C10;color:#FFD48A}
.b-mio{background:var(--marca);color:#fff}
.fam .b-mio{background:#fff;color:var(--marca)}
.oscuro .b-mio{background:#5FBF8F;color:#0E241A}
.precio{font-family:var(--t);font-weight:700;font-size:30px;margin-top:12px}
.precio small{font-size:15px;font-weight:500;opacity:.75}
.nota{font-size:13.5px;margin-top:2px;color:var(--gris)} .fam .nota{color:rgba(255,255,255,.88)}
.ahorro{color:#1B7A4E;font-weight:700} .fam .ahorro{color:#FFD48A} .oscuro .ahorro{color:#7FD6A6}
ul{list-style:none;padding:0;margin:14px 0 0;border-top:1px solid var(--linea);padding-top:12px}
.fam ul{border-color:rgba(255,255,255,.18)}
li{display:flex;gap:10px;font-size:14.5px;line-height:1.35;margin:9px 0}
li:before{content:"✓";font-weight:800;color:var(--marca);flex:none;width:18px}
.fam li:before{color:var(--acento)} .oscuro li:before{color:#7FD6A6}
.vertodo{font-size:13.5px;font-weight:600;color:var(--marca);margin:4px 0 0 28px}
.fam .vertodo{color:#FFD48A} .oscuro .vertodo{color:#7FD6A6}
.btn{margin-top:14px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--t);font-weight:700;font-size:15px}
.b1{background:var(--acento);color:#2E1F00}
.b2{border:1.5px solid var(--linea);background:transparent;color:var(--tinta)}
.fam .b2{border-color:rgba(255,255,255,.5);color:#fff}
.legal{font-size:12.5px;color:var(--gris);text-align:center;line-height:1.5;margin-top:16px}
.cancel{display:block;text-align:center;margin-top:14px;font-size:14px;font-weight:600;color:var(--gris);text-decoration:underline}
</style></head><body><div id="todo"></div>
<script>
const P = {
  mens:{prem:['$3.000','/mes','O $30.000 al año <span class="ahorro">con 2 meses gratis</span>'],
        fam:['$5.000','/mes','Para hasta 5 personas']},
  anual:{prem:['$30.000','/año','Sale $2.500 por mes · <span class="ahorro">ahorrás $6.000</span>'],
         fam:['$50.000','/año','Para hasta 5 personas · sale $4.167 por mes · <span class="ahorro">ahorrás $10.000</span>']}};
const FP = ['Chat sin límite, escrito o con audios','Límites por categoría y avisos antes de pasarte','Importá el resumen de Mercado Pago o del banco','Metas de ahorro sin límite'];
const FF = ['Todo lo de Premium, para cada uno','Gastos de la casa compartidos: cada uno elige qué comparte','Cuentas claras: quién puso qué y cuánto le toca a cada uno','Lista del súper de la casa'];
const FG = ['30 mensajes o movimientos por mes','Inicio y gráficos sin límite','Un presupuesto total y una meta de ahorro'];
const lista = (f,n) => `<ul>${f.map(x=>`<li>${x}</li>`).join('')}</ul><div class="vertodo">Ver todo lo que incluye (${n}) ⌄</div>`;

function pantalla({titulo, tema='claro', periodo='mens', plan='gratis'}){
  const p = P[periodo];
  const tieneFam = plan==='familiar';
  return `<div class="col"><p class="rot">${titulo}</p><div class="pan ${tema}">
  <h1>‹&nbsp; Elegí tu plan</h1><div class="sub">Ordená tu plata sin límites. Cancelás cuando quieras.</div>
  <div class="tog"><div class="${periodo==='mens'?'on':''}">Mensual</div><div class="${periodo==='anual'?'on':''}">Anual <span class="chip">2 meses gratis</span></div></div>

  <div class="card prem"><div class="top"><span class="ico">★</span><span class="nom">Premium</span>
    ${tieneFam?'':'<span class="badge b-rec">Recomendado para vos</span>'}</div>
    <div class="precio">${p.prem[0]} <small>${p.prem[1]}</small></div><div class="nota">${p.prem[2]}</div>
    ${lista(FP,7)}
    <div class="btn ${tieneFam?'b2':'b1'}">${tieneFam?'Cambiar a Premium':'Elegir Premium'}</div></div>

  <div class="card fam"><div class="top"><span class="ico">⌂</span><span class="nom">Familiar</span>
    ${tieneFam?'<span class="badge b-mio">✓ Tu plan</span>':''}</div>
    <div class="precio">${p.fam[0]} <small>${p.fam[1]}</small></div><div class="nota">${p.fam[2]}</div>
    ${lista(FF,5)}
    <div class="btn ${tieneFam?'b2':'b1'}">${tieneFam?'Ver mi familia':'Elegir Familiar'}</div></div>

  <div class="card ${plan==='gratis'?'mio':''}"><div class="top"><span class="nom" style="font-size:17px">Gratis</span>
    <span style="font-family:var(--t);font-weight:700;margin-left:10px">$0</span>
    ${plan==='gratis'?'<span class="badge b-mio">✓ Tu plan</span>':''}</div>
    <ul style="border:none;padding-top:0;margin-top:8px">${FG.map(x=>`<li>${x}</li>`).join('')}</ul></div>

  <div class="legal">Se paga con Google Play y se renueva solo. Podés cancelar cuando quieras desde Perfil → Tu plan o desde Google Play. Los precios se actualizan con aviso previo.</div>
  ${tieneFam?'<a class="cancel">Cancelar mi plan</a>':''}
  </div></div>`;
}
document.getElementById('todo').innerHTML = [
  pantalla({titulo:'1 · Mensual (usuario Gratis)'}),
  pantalla({titulo:'2 · Anual (usuario Gratis)', periodo:'anual'}),
  pantalla({titulo:'3 · Usuario con Familiar', plan:'familiar'}),
  pantalla({titulo:'4 · Modo oscuro', tema:'oscuro'}),
].join('');
</script></body></html>
